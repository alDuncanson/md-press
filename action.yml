name: 'md-press'
description: 'Free Markdown publishing'
author: 'alDuncanson'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  source:
    description: 'Source Markdown file (single-file mode)'
    required: false
    default: 'document.md'
  sources:
    description: 'Space or newline separated list of Markdown files or glob patterns (multi-file mode)'
    required: false
    default: ''
  output-pdf:
    description: 'Output PDF filename'
    required: false
    default: 'document.pdf'
  output-html:
    description: 'Output HTML filename'
    required: false
    default: 'index.html'
  output-preview:
    description: 'Output preview image filename (without extension). Defaults to PDF name if not set.'
    required: false
    default: ''
  preview-dpi:
    description: 'Preview image resolution in DPI'
    required: false
    default: '150'
  mode:
    description: 'Multi-file mode: "combined" (one PDF) or "collection" (separate PDFs per file)'
    required: false
    default: 'combined'
  index-title:
    description: 'Title for the auto-generated index page (multi-file mode)'
    required: false
    default: 'Index'
  deploy:
    description: 'Whether to deploy to GitHub Pages: "auto" deploys except on pull_request events, which build a preview instead; "true" or "false" forces it'
    required: false
    default: 'auto'
  artifact-name:
    description: 'Name of the workflow artifact containing the generated site, uploaded when not deploying'
    required: false
    default: 'md-press-site'
  pr-comment:
    description: 'When not deploying on a pull_request event, post or update a comment linking to the preview artifacts. Requires the pull-requests: write permission.'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to read the GitHub Pages URL and comment on pull requests'
    required: false
    default: ${{ github.token }}

outputs:
  pdf:
    description: 'Path to generated PDF file'
    value: _site/${{ inputs.output-pdf }}
  html:
    description: 'Path to generated HTML file'
    value: _site/${{ inputs.output-html }}
  preview:
    description: 'Path to generated preview PNG file'
    value: _site/${{ steps.names.outputs.preview }}
  page_url:
    description: 'URL of the deployed GitHub Pages site'
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Decide whether to deploy
      id: plan
      shell: bash
      env:
        DEPLOY: ${{ inputs.deploy }}
      run: |
        case "$DEPLOY" in
          auto)
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then DEPLOY=false; else DEPLOY=true; fi ;;
          true|false) ;;
          *)
            echo "::error title=md-press::Invalid deploy input '${DEPLOY}'. Use auto, true, or false."
            exit 1 ;;
        esac
        echo "Deploy: ${DEPLOY}"
        echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"

    - name: Check source file (single-file mode)
      if: ${{ inputs.sources == '' }}
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        if [ ! -f "$SOURCE" ]; then
          echo "::error title=md-press::Source file '${SOURCE}' was not found. Add it to your repository, or set the 'source' input to your Markdown file."
          exit 1
        fi

    - name: Install pandoc and poppler-utils
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc poppler-utils

    - name: Restore tectonic package cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/Tectonic
        # A new cache is saved when Markdown changes; restore-keys reuses the latest
        key: md-press-tectonic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.md') }}
        restore-keys: |
          md-press-tectonic-${{ runner.os }}-${{ runner.arch }}-

    - name: Install tectonic
      uses: wtfjoke/setup-tectonic@v4
      with:
        github-token: ${{ github.token }}

    - name: Create output directory
      shell: bash
      run: mkdir -p _site

    - name: Resolve GitHub Pages URL
      id: pages
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # Prefer the configured Pages URL, which includes custom domains.
        # Reading it needs the pages permission, so fall back to the default URL.
        BASE_URL=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null) || BASE_URL=""

        if [ -z "$BASE_URL" ]; then
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            BASE_URL="https://${OWNER}.github.io"
          else
            BASE_URL="https://${OWNER}.github.io/${REPO}"
          fi
        fi

        echo "Using base URL ${BASE_URL%/}"
        echo "base-url=${BASE_URL%/}" >> "$GITHUB_OUTPUT"

    - name: Resolve output file names
      id: names
      shell: bash
      env:
        PDF_NAME: ${{ inputs.output-pdf }}
        PREVIEW_NAME: ${{ inputs.output-preview }}
      run: |
        echo "pdf=${PDF_NAME}" >> "$GITHUB_OUTPUT"
        echo "preview=${PREVIEW_NAME:-${PDF_NAME%.pdf}}.png" >> "$GITHUB_OUTPUT"

    - name: Resolve source files (multi-file mode)
      if: ${{ inputs.sources != '' }}
      shell: bash
      env:
        SOURCES: ${{ inputs.sources }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob

        FILES=()

        # Word splitting and globbing are intentional: SOURCES is a list of patterns
        for pattern in $SOURCES; do
          for f in $pattern; do
            [ -f "$f" ] || continue
            FILES+=("$f")
          done
        done

        if [ ${#FILES[@]} -eq 0 ]; then
          echo "::error title=md-press::No source files matched patterns: ${SOURCES}"
          exit 1
        fi

        mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | sort -Vu)

        printf '%s\n' "${FILES[@]}" > /tmp/mdpress_files.txt
        echo "Found ${#FILES[@]} source file(s):"
        cat /tmp/mdpress_files.txt

    - name: Generate PDF (single-file mode)
      if: ${{ inputs.sources == '' }}
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        PDF: _site/${{ inputs.output-pdf }}
      run: |
        pandoc "$SOURCE" \
          -o "$PDF" \
          --pdf-engine tectonic \
          --lua-filter="$GITHUB_ACTION_PATH/filters/mdlinks-to-anchors.lua"

    - name: Generate PDF (multi-file mode, combined)
      if: ${{ inputs.sources != '' && inputs.mode == 'combined' }}
      shell: bash
      env:
        PDF: _site/${{ inputs.output-pdf }}
      run: |
        set -euo pipefail
        mapfile -t FILES < /tmp/mdpress_files.txt

        # Combine files with page breaks between them
        COMBINED=/tmp/mdpress_combined.md
        : > "$COMBINED"

        for i in "${!FILES[@]}"; do
          if [ "$i" -gt 0 ]; then
            printf '\n\\newpage\n\n' >> "$COMBINED"
          fi
          cat "${FILES[$i]}" >> "$COMBINED"
        done

        pandoc "$COMBINED" \
          -o "$PDF" \
          --pdf-engine tectonic \
          --lua-filter="$GITHUB_ACTION_PATH/filters/mdlinks-to-anchors.lua"

    - name: Generate PDFs (multi-file mode, collection)
      if: ${{ inputs.sources != '' && inputs.mode == 'collection' }}
      shell: bash
      run: |
        set -euo pipefail

        while IFS= read -r SRC; do
          REL="${SRC#./}"
          PDF_DEST="_site/${REL%.md}.pdf"
          mkdir -p "$(dirname "$PDF_DEST")"

          echo "Converting $SRC -> $PDF_DEST"
          pandoc "$SRC" \
            -o "$PDF_DEST" \
            --pdf-engine tectonic \
            --lua-filter="$GITHUB_ACTION_PATH/filters/mdlinks-to-anchors.lua"
        done < /tmp/mdpress_files.txt

    - name: Generate HTML (single-file mode)
      if: ${{ inputs.sources == '' }}
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        DEST: _site/${{ inputs.output-html }}
        BASE_URL: ${{ steps.pages.outputs.base-url }}
        PREVIEW: ${{ steps.names.outputs.preview }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/render-html.sh" "$SOURCE" "$DEST" "${BASE_URL}/" "${BASE_URL}/${PREVIEW}"

    - name: Generate HTML pages (multi-file mode)
      if: ${{ inputs.sources != '' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE_URL: ${{ steps.pages.outputs.base-url }}
        PREVIEW: ${{ steps.names.outputs.preview }}
      run: |
        set -euo pipefail

        while IFS= read -r SRC; do
          REL="${SRC#./}"
          if [ "$MODE" = "collection" ]; then
            IMAGE_URL="${BASE_URL}/${REL%.md}.png"
          else
            IMAGE_URL="${BASE_URL}/${PREVIEW}"
          fi
          "$GITHUB_ACTION_PATH/scripts/render-html.sh" "$SRC" "_site/${REL%.md}.html" \
            "${BASE_URL}/${REL%.md}.html" "$IMAGE_URL"
        done < /tmp/mdpress_files.txt

    - name: Generate index page (multi-file mode)
      if: ${{ inputs.sources != '' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        INDEX_TITLE: ${{ inputs.index-title }}
        DEST: _site/${{ inputs.output-html }}
        BASE_URL: ${{ steps.pages.outputs.base-url }}
        PREVIEW: ${{ steps.names.outputs.preview }}
      run: |
        set -euo pipefail

        INDEX_MD=/tmp/mdpress_index.md

        {
          echo "# ${INDEX_TITLE}"
          echo
          echo "_Generated by [md-press](https://github.com/alDuncanson/md-press)_"
          echo

          while IFS= read -r SRC; do
            REL="${SRC#./}"
            HTML="${REL%.md}.html"

            TITLE=$(grep -m1 '^# ' "$SRC" | sed 's/^# //' || true)
            if [ -z "$TITLE" ]; then
              TITLE="${REL%.md}"
            fi

            if [ "$MODE" = "collection" ]; then
              echo "- [${TITLE}](${HTML}) ([PDF](${REL%.md}.pdf))"
            else
              echo "- [${TITLE}](${HTML})"
            fi
          done < /tmp/mdpress_files.txt
        } > "$INDEX_MD"

        # Collections have no combined preview, so use the first document's
        if [ "$MODE" = "collection" ]; then
          FIRST=$(head -n1 /tmp/mdpress_files.txt)
          FIRST="${FIRST#./}"
          IMAGE_URL="${BASE_URL}/${FIRST%.md}.png"
        else
          IMAGE_URL="${BASE_URL}/${PREVIEW}"
        fi

        "$GITHUB_ACTION_PATH/scripts/render-html.sh" "$INDEX_MD" "$DEST" "${BASE_URL}/" "$IMAGE_URL"

    - name: Generate preview image (single-file or combined mode)
      if: ${{ inputs.sources == '' || inputs.mode == 'combined' }}
      shell: bash
      env:
        PDF: _site/${{ steps.names.outputs.pdf }}
        PREVIEW: _site/${{ steps.names.outputs.preview }}
        DPI: ${{ inputs.preview-dpi }}
      run: |
        pdftoppm "$PDF" "${PREVIEW%.png}" -png -singlefile -rx "$DPI" -ry "$DPI"

    - name: Generate preview images (collection mode)
      if: ${{ inputs.sources != '' && inputs.mode == 'collection' }}
      shell: bash
      env:
        DPI: ${{ inputs.preview-dpi }}
      run: |
        set -euo pipefail

        while IFS= read -r SRC; do
          REL="${SRC#./}"
          PDF="_site/${REL%.md}.pdf"
          PREVIEW="_site/${REL%.md}"

          echo "Generating preview for $PDF"
          pdftoppm "$PDF" "$PREVIEW" -png -singlefile -rx "$DPI" -ry "$DPI"
        done < /tmp/mdpress_files.txt

    - name: Upload site artifact
      id: upload-site
      if: ${{ steps.plan.outputs.deploy != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: _site
        if-no-files-found: error
        overwrite: true

    - name: Upload PDF artifact
      id: upload-pdf
      if: ${{ steps.plan.outputs.deploy != 'true' && (inputs.sources == '' || inputs.mode == 'combined') }}
      uses: actions/upload-artifact@v7
      with:
        path: _site/${{ steps.names.outputs.pdf }}
        archive: false
        if-no-files-found: error
        overwrite: true

    - name: Upload HTML artifact
      id: upload-html
      if: ${{ steps.plan.outputs.deploy != 'true' && inputs.sources == '' }}
      uses: actions/upload-artifact@v7
      with:
        path: _site/${{ inputs.output-html }}
        archive: false
        if-no-files-found: error
        overwrite: true

    - name: Upload preview image artifact
      id: upload-preview
      if: ${{ steps.plan.outputs.deploy != 'true' && (inputs.sources == '' || inputs.mode == 'combined') }}
      uses: actions/upload-artifact@v7
      with:
        path: _site/${{ steps.names.outputs.preview }}
        archive: false
        if-no-files-found: error
        overwrite: true

    - name: Comment on pull request
      if: ${{ steps.plan.outputs.deploy != 'true' && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        SITE_URL: ${{ steps.upload-site.outputs.artifact-url }}
        PDF_NAME: ${{ steps.names.outputs.pdf }}
        PDF_URL: ${{ steps.upload-pdf.outputs.artifact-url }}
        HTML_NAME: ${{ inputs.output-html }}
        HTML_URL: ${{ steps.upload-html.outputs.artifact-url }}
        PREVIEW_NAME: ${{ steps.names.outputs.preview }}
        PREVIEW_URL: ${{ steps.upload-preview.outputs.artifact-url }}
      run: |
        set -euo pipefail

        MARKER="<!-- md-press-preview:${ARTIFACT_NAME} -->"

        {
          echo "$MARKER"
          echo "### [md-press](https://github.com/marketplace/actions/md-press) preview"
          echo
          echo "Built from ${HEAD_SHA:0:7} in [this workflow run](${RUN_URL})."
          echo
          echo "| Output | Link |"
          echo "| --- | --- |"
          [ -n "$PDF_URL" ] && echo "| PDF | [${PDF_NAME}](${PDF_URL}) |"
          [ -n "$HTML_URL" ] && echo "| HTML | [${HTML_NAME}](${HTML_URL}) |"
          [ -n "$PREVIEW_URL" ] && echo "| Preview image | [${PREVIEW_NAME}](${PREVIEW_URL}) |"
          echo "| Full site | [${ARTIFACT_NAME}.zip](${SITE_URL}) |"
          echo
          echo "<sub>Artifact links require signing in to GitHub and expire with this repository's artifact retention period.</sub>"
        } > /tmp/mdpress_comment.md

        COMMENTS_URL="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"

        if ! COMMENT_ID=$(gh api --paginate "$COMMENTS_URL" \
          | jq -rs --arg marker "$MARKER" '[.[][] | select(.body | startswith($marker)) | .id] | first // empty'); then
          echo "::warning::Could not read pull request comments; skipping preview comment."
          exit 0
        fi

        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -F body=@/tmp/mdpress_comment.md > /dev/null \
            || echo "::warning::Could not update the preview comment. Grant the pull-requests: write permission to enable it."
        else
          gh api "$COMMENTS_URL" -F body=@/tmp/mdpress_comment.md > /dev/null \
            || echo "::warning::Could not post the preview comment. Grant the pull-requests: write permission to enable it."
        fi

    - name: Upload Pages artifact
      if: ${{ steps.plan.outputs.deploy == 'true' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy to GitHub Pages
      if: ${{ steps.plan.outputs.deploy == 'true' }}
      id: deploy
      uses: actions/deploy-pages@v5
