name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Refresh badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run badges.yml --repo "$GITHUB_REPOSITORY"
